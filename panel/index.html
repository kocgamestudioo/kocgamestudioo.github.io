<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SugarForge Panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@700;800;900&display=swap">
<style data-lock>
:root{--bg:#FFF6EC;--surface:#FFFFFF;--text:#3A1F1A;--muted:#74493F;--line:#EBCDB8;--primary:#C92A62;--primary-press:#A81F50;--err:#B3261E;--err-soft:#FDE3E1;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 24px -12px rgba(140,60,30,.35),0 2px 0 #F0D6C2;
  --hero:radial-gradient(120% 140% at 0% 0%,#FFD4E2 0%,transparent 55%),radial-gradient(120% 120% at 100% 0%,#FFE2B8 0%,transparent 60%);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1C1113;--surface:#2A1A1E;--text:#FFEDE6;--muted:#E0BDB3;--line:#553840;--primary:#FF6B9A;--primary-press:#FF8DB1;--err:#FF9A90;--err-soft:#4A1D1D;
  --shadow:0 12px 26px -14px rgba(0,0,0,.8),0 0 0 1px #47303A;--hero:radial-gradient(120% 140% at 0% 0%,#4A1F2C 0%,transparent 55%),radial-gradient(120% 120% at 100% 0%,#45301A 0%,transparent 60%);color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--hero),var(--bg);color:var(--text);font:700 16px/1.5 "Nunito",system-ui,sans-serif;padding:24px 16px}
.box{width:100%;max-width:400px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:28px 22px}
.logo{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--primary);color:#fff;margin:0 auto 14px;box-shadow:var(--shadow)}
.logo svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font:600 24px "Fredoka",system-ui,sans-serif;text-align:center;margin:0}
p.sub{text-align:center;color:var(--muted);margin:4px 0 20px;font-size:15px}
label{display:block;font-weight:900;margin-bottom:6px}
.pw{display:flex;gap:8px}
.pw input{flex:1;min-width:0;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--text);padding:0 14px;font:800 17px "Nunito",sans-serif}
.pw input:focus{border-color:var(--primary);outline:0}
.eye{min-width:52px;padding:0 12px;flex:none;white-space:nowrap;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font:900 13px "Nunito"}
.go{width:100%;min-height:54px;margin-top:14px;border:0;border-radius:14px;background:var(--primary);color:#fff;font:900 17px "Nunito",sans-serif;cursor:pointer;transition:transform 120ms}
.go:active{transform:scale(.97);background:var(--primary-press)}
.go[disabled]{opacity:.6;cursor:wait}
.err{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--err-soft);color:var(--err);font-weight:900;font-size:15px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.go{transition:none}}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3c2 3 5 4.5 5 8.5A5 5 0 0 1 7 11.5c0-2 1-3.2 2-4.2.3 1.6 1.2 2.4 2 2.7C10.6 7.6 11 5 12 3Z"/><path d="M5 20h14"/></svg></div>
  <h1>SugarForge Panel</h1>
  <p class="sub">Bu sayfa şifreli. Açmak için panel şifreni yaz.</p>
  <input type="text" name="username" value="SugarForge Panel" autocomplete="username" hidden readonly>
  <label for="pw">Şifre</label>
  <div class="pw"><input type="password" id="pw" name="password" autocomplete="current-password"><button type="button" class="eye" id="eye" aria-label="Şifreyi göster" aria-pressed="false">Göster</button></div>
  <button class="go" id="go" type="submit">Aç</button>
  <div class="err" id="err" role="alert" hidden></div>
  <p class="foot">Şifre bu cihazdan çıkmaz; sayfa tarayıcının içinde açılır.</p>
</form>
